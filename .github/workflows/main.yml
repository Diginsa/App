name: Build BUPOLY Android App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose what to build'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - both
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Build APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build AAB
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both') }}
        run: gradle --no-daemon --stacktrace :app:bundleRelease

      - name: Upload debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: BUPOLY-SRMS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: BUPOLY-SRMS-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          echo "## BUPOLY Android build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gradle: 8.10.2" >> "$GITHUB_STEP_SUMMARY"
          echo "JDK: 17" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK/AAB from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
